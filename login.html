<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему | Кафедра математики СОГУ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <div class="header-container">
            <div>
                <img src="images/logo.png" class="header_logo-img" alt="СОГУ">
                <div class="logo-text" style="margin-top: 8px;">
                    <h1>Кафедра Математики</h1>
                    <p>СОГУ им. К. Л. Хетагурова</p>
                </div>
            </div>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="about.html">О кафедре</a></li>
                    <li><a href="rules.html">Правила</a></li>
                    <li><a href="contacts.html">Контакты</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="auth-wrapper">
            <h2 class="auth-title">Авторизация</h2>
            <form action="profile.html" method="GET">
                <label class="form-label">Войти как:</label>
                <div class="role-selector">
                    <div class="role-option">
                        <input type="radio" id="role-student" name="role" value="student" checked>
                        <label for="role-student">Студент</label>
                    </div>
                    <div class="role-option">
                        <input type="radio" id="role-teacher" name="role" value="teacher">
                        <label for="role-teacher">Преподаватель</label>
                    </div>
                    <div class="role-option">
                        <input type="radio" id="role-admin" name="role" value="admin">
                        <label for="role-admin">Админ</label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Электронная почта</label>
                    <input type="email" id="email" class="form-control" placeholder="username@nosu.ru" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Пароль</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Войти</button>
            </form>
            
            <div class="auth-redirect">
                Еще нет аккаунта? <a href="register.html">Зарегистрироваться</a>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-bottom" style="text-align: center; font-size: 0.8rem; padding: 0;">
            <p>&copy; 2026 Северо-Осетинский государственный университет. Все права защищены.</p>
        </div>
    </footer>

</body>
</html>
